name: Build iOS App and Upload Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Xcode
      - name: Set up Xcode
        uses: actions/setup-xcode@v1
        with:
          xcode-version: '15.2'  # Specify your desired Xcode version

      # Install dependencies (e.g., CocoaPods)
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install --repo-update

      # Build the app
      - name: Build iOS app
        run: |
          xcodebuild -workspace YourApp.xcworkspace \
                     -scheme YourApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath ${{ github.workspace }}/build/YourApp.xcarchive archive
          xcodebuild -exportArchive \
                     -archivePath ${{ github.workspace }}/build/YourApp.xcarchive \
                     -exportPath ${{ github.workspace }}/build \
                     -exportOptionsPlist ExportOptions.plist

      # Upload the IPA as an artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/*.ipa
